# yaml-language-server: $schema=./server-config.schema.json
host: localhost
port: 8080
logLevel: info

# union by wrapping key
notifications:
- slack: { channel: "#alerts" }
- email:
    to: ops@example.com
    subject: "[alert] server"
- webhook: { url: https://example.com/hook }
- console:

endpoints:
  - path: /api/users
  - path: /api/orders
    timeout: 60

# union by YAML tag
shapes:
  - !circle { radius: 1.5 }
  - !rect
    width: 2
    height: 3

# union by discriminator key
healthChecks:
  - type: http
    url: http://localhost:8080/healthz
  - type: tcp
    port: 5432
